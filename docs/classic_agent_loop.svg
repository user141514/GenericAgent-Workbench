  .node-title-invert { font-size: 14px; font-weight: 700; fill: #ffffff; }
  .node-sub { font-size: 11px; font-weight: 500; fill: #475569; }
  .node-sub-invert { font-size: 11px; font-weight: 500; fill: #dbeafe; }
  .arrow-label { font-size: 10px; font-weight: 600; fill: #374151; }
  .legend { font-size: 12px; font-weight: 500; fill: #475569; }
  .small-label { font-size: 10px; font-weight: 500; fill: #64748b; }
  .mono { font-family: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace; font-size: 11px; fill: #e5e7eb; }
  .mono-dark { font-family: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace; font-size: 11px; fill: #374151; }
</style>
<defs>
