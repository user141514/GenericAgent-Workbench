<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" width="960" height="820">
<style>
  text {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Helvetica Neue", Helvetica, Arial,
                 "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", "SimHei",
                 sans-serif;
  }
  .title { font-size: 26px; font-weight: 700; fill: #111827; }
  .subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
  .section { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #0b3d91; }
